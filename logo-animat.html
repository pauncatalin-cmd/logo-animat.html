<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    width:100vw;
    height:100vh;
    overflow:hidden;
    background:transparent;
}

.logo-box{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
}

.logo-wrap{
    position:relative;
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    animation:logoFloat 3s ease-in-out infinite;
}

.logo-wrap::before{
    content:"";
    position:absolute;
    width:115%;
    height:115%;
    border-radius:50%;
    background:radial-gradient(circle, rgba(0,234,255,.35), rgba(255,79,216,.18), transparent 68%);
    filter:blur(16px);
    opacity:.9;
    animation:neonPulse 2.2s ease-in-out infinite;
}

.logo-wrap::after{
    content:"";
    position:absolute;
    width:120%;
    height:120%;
    border-radius:50%;
    border:2px solid rgba(0,234,255,.65);
    box-shadow:
        0 0 12px rgba(0,234,255,.9),
        0 0 28px rgba(255,79,216,.7);
    opacity:.75;
    animation:ringPulse 2.4s ease-in-out infinite;
}

.logo{
    position:relative;
    z-index:5;
    max-width:100%;
    max-height:100%;
    object-fit:contain;
    filter:
        drop-shadow(0 0 8px rgba(0,234,255,1))
        drop-shadow(0 0 18px rgba(0,170,255,.9))
        drop-shadow(0 0 26px rgba(255,79,216,.65));
    animation:logoGlow 2.4s ease-in-out infinite;
}

.spark{
    position:absolute;
    width:4px;
    height:4px;
    border-radius:50%;
    background:#00eaff;
    box-shadow:
        0 0 8px #00eaff,
        0 0 18px #ff4fd8;
    opacity:0;
    animation:sparkMove 2.6s linear infinite;
}

.spark:nth-child(1){left:12%; top:18%; animation-delay:.1s;}
.spark:nth-child(2){left:82%; top:22%; animation-delay:.6s;}
.spark:nth-child(3){left:18%; top:78%; animation-delay:1.1s;}
.spark:nth-child(4){left:76%; top:72%; animation-delay:1.6s;}
.spark:nth-child(5){left:50%; top:5%; animation-delay:2s;}

@keyframes logoFloat{
    0%,100%{
        transform:translateY(0) scale(1);
    }
    50%{
        transform:translateY(-5px) scale(1.035);
    }
}

@keyframes neonPulse{
    0%,100%{
        transform:scale(.95);
        opacity:.55;
    }
    50%{
        transform:scale(1.12);
        opacity:1;
    }
}

@keyframes ringPulse{
    0%,100%{
        transform:scale(.92);
        opacity:.35;
    }
    50%{
        transform:scale(1.08);
        opacity:.9;
    }
}

@keyframes logoGlow{
    0%,100%{
        filter:
            drop-shadow(0 0 8px rgba(0,234,255,1))
            drop-shadow(0 0 18px rgba(0,170,255,.9))
            drop-shadow(0 0 26px rgba(255,79,216,.55));
    }
    50%{
        filter:
            drop-shadow(0 0 14px rgba(255,79,216,1))
            drop-shadow(0 0 26px rgba(0,234,255,1))
            drop-shadow(0 0 42px rgba(0,170,255,.9));
    }
}

@keyframes sparkMove{
    0%{
        opacity:0;
        transform:translateY(18px) scale(.4);
    }
    35%{
        opacity:1;
        transform:translateY(0) scale(1.2);
    }
    100%{
        opacity:0;
        transform:translateY(-28px) scale(.5);
    }
}
</style>
</head>

<body>

<div class="logo-box">
    <div class="logo-wrap">
        <span class="spark"></span>
        <span class="spark"></span>
        <span class="spark"></span>
        <span class="spark"></span>
        <span class="spark"></span>

        <img class="logo" src="logo.png">
    </div>
</div>

</body>
</html>
