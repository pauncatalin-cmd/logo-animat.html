<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>B-Zone Logo Animated</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:transparent;
}

body{
    display:flex;
    align-items:center;
    justify-content:center;
}

.logo-box{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    background:transparent;
}

.logo-wrap{
    position:relative;
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    animation:logoFloat 3s ease-in-out infinite;
}

.logo{
    position:relative;
    z-index:5;
    width:94%;
    height:auto;
    object-fit:contain;

    filter:
        saturate(1.35)
        contrast(1.12)
        brightness(1.08)
        drop-shadow(0 0 8px rgba(0,234,255,1))
        drop-shadow(0 0 18px rgba(0,170,255,.95))
        drop-shadow(0 0 26px rgba(0,234,255,.65));

    animation:logoGlow 2.6s ease-in-out infinite;
}

.spark{
    position:absolute;
    width:4px;
    height:4px;
    border-radius:50%;
    opacity:0;
    z-index:2;
}

.spark.blue{
    background:#00eaff;
    box-shadow:
        0 0 8px #00eaff,
        0 0 18px #00eaff;
}

.spark.pink{
    background:#ff4fd8;
    box-shadow:
        0 0 8px #ff4fd8,
        0 0 18px #ff4fd8;
}

.s1{left:14%; top:18%; animation:sparkMove 2.7s linear infinite;}
.s2{left:84%; top:24%; animation:sparkMove 3s linear infinite .4s;}
.s3{left:18%; top:78%; animation:sparkMove 2.8s linear infinite .8s;}
.s4{left:78%; top:72%; animation:sparkMove 3.2s linear infinite 1.2s;}
.s5{left:50%; top:10%; animation:sparkMove 2.9s linear infinite 1.5s;}
.s6{left:52%; top:86%; animation:sparkMove 3.1s linear infinite 1.9s;}

@keyframes logoFloat{
    0%,100%{
        transform:translateY(0) scale(1);
    }

    50%{
        transform:translateY(-4px) scale(1.025);
    }
}

@keyframes logoGlow{
    0%,100%{
        filter:
            saturate(1.35)
            contrast(1.12)
            brightness(1.08)
            drop-shadow(0 0 8px rgba(0,234,255,1))
            drop-shadow(0 0 18px rgba(0,170,255,.95))
            drop-shadow(0 0 26px rgba(0,234,255,.65));
    }

    50%{
        filter:
            saturate(1.55)
            contrast(1.18)
            brightness(1.18)
            drop-shadow(0 0 10px rgba(255,79,216,.85))
            drop-shadow(0 0 22px rgba(0,234,255,1))
            drop-shadow(0 0 38px rgba(0,170,255,1));
    }
}

@keyframes sparkMove{
    0%{
        opacity:0;
        transform:translateY(14px) scale(.4);
    }

    30%{
        opacity:1;
        transform:translateY(0) scale(1.15);
    }

    100%{
        opacity:0;
        transform:translateY(-24px) scale(.5);
    }
}
</style>
</head>

<body>

<div class="logo-box">
    <div class="logo-wrap">

        <span class="spark blue s1"></span>
        <span class="spark pink s2"></span>
        <span class="spark blue s3"></span>
        <span class="spark pink s4"></span>
        <span class="spark blue s5"></span>
        <span class="spark pink s6"></span>

        <img class="logo" src="logobzone.png">

    </div>
</div>

</body>
</html>
