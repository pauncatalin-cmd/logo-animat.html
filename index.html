<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KIP Animated Logo</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:transparent;
}

body{
    display:flex;
    align-items:center;
    justify-content:center;
}

.logo-box{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    background:transparent;
}

.logo-wrap{
    position:relative;
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    animation:logoFloat 3s ease-in-out infinite;
}

.logo-wrap::before{
    content:"";
    position:absolute;
    width:95%;
    height:95%;
    border-radius:50%;
    background:
    radial-gradient(circle,
    rgba(0,234,255,.28) 0%,
    rgba(255,79,216,.16) 45%,
    transparent 72%);
    filter:blur(18px);
    opacity:.95;
    animation:neonPulse 2.5s ease-in-out infinite;
}

.logo-wrap::after{
    content:"";
    position:absolute;
    width:102%;
    height:102%;
    border-radius:50%;
    border:2px solid rgba(0,234,255,.55);
    box-shadow:
    0 0 12px rgba(0,234,255,.95),
    0 0 24px rgba(255,79,216,.75),
    0 0 40px rgba(0,170,255,.45);
    opacity:.7;
    animation:ringPulse 2.8s ease-in-out infinite;
}

.logo{
    position:relative;
    z-index:5;
    width:92%;
    height:auto;
    object-fit:contain;

    filter:
    drop-shadow(0 0 10px rgba(0,234,255,1))
    drop-shadow(0 0 18px rgba(0,170,255,.95))
    drop-shadow(0 0 28px rgba(255,79,216,.7));

    animation:logoGlow 2.5s ease-in-out infinite;
}

.spark{
    position:absolute;
    width:4px;
    height:4px;
    border-radius:50%;
    opacity:0;
}

.spark.blue{
    background:#00eaff;
    box-shadow:
    0 0 8px #00eaff,
    0 0 18px #00eaff;
}

.spark.pink{
    background:#ff4fd8;
    box-shadow:
    0 0 8px #ff4fd8,
    0 0 18px #ff4fd8;
}

.s1{
    left:12%;
    top:20%;
    animation:sparkMove 2.6s linear infinite;
}

.s2{
    left:84%;
    top:24%;
    animation:sparkMove 3s linear infinite .4s;
}

.s3{
    left:18%;
    top:76%;
    animation:sparkMove 2.8s linear infinite .8s;
}

.s4{
    left:76%;
    top:70%;
    animation:sparkMove 3.2s linear infinite 1.2s;
}

.s5{
    left:50%;
    top:8%;
    animation:sparkMove 2.9s linear infinite 1.5s;
}

.s6{
    left:52%;
    top:84%;
    animation:sparkMove 3.1s linear infinite 1.9s;
}

@keyframes logoFloat{

    0%,100%{
        transform:translateY(0) scale(1);
    }

    50%{
        transform:translateY(-4px) scale(1.02);
    }
}

@keyframes neonPulse{

    0%,100%{
        transform:scale(.94);
        opacity:.5;
    }

    50%{
        transform:scale(1.08);
        opacity:1;
    }
}

@keyframes ringPulse{

    0%,100%{
        transform:scale(.96);
        opacity:.35;
    }

    50%{
        transform:scale(1.04);
        opacity:.9;
    }
}

@keyframes logoGlow{

    0%,100%{
        filter:
        drop-shadow(0 0 10px rgba(0,234,255,1))
        drop-shadow(0 0 18px rgba(0,170,255,.95))
        drop-shadow(0 0 28px rgba(255,79,216,.7));
    }

    50%{
        filter:
        drop-shadow(0 0 16px rgba(255,79,216,1))
        drop-shadow(0 0 28px rgba(0,234,255,1))
        drop-shadow(0 0 42px rgba(0,170,255,1));
    }
}

@keyframes sparkMove{

    0%{
        opacity:0;
        transform:translateY(14px) scale(.4);
    }

    30%{
        opacity:1;
        transform:translateY(0) scale(1.15);
    }

    100%{
        opacity:0;
        transform:translateY(-24px) scale(.5);
    }
}

</style>
</head>

<body>

<div class="logo-box">

    <div class="logo-wrap">

        <span class="spark blue s1"></span>
        <span class="spark pink s2"></span>
        <span class="spark blue s3"></span>
        <span class="spark pink s4"></span>
        <span class="spark blue s5"></span>
        <span class="spark pink s6"></span>

        <img class="logo" src="logobzone.png">

    </div>

</div>

</body>
</html>
